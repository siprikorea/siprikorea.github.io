<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>siprikorea</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7307458713357305"
     crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    html,body{margin:0;min-height:100%;background:#11131a;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box}
    h1{margin:0 0 8px;font-size:26px;font-weight:700}
    p.sub{margin:0 0 32px;opacity:.65;font-size:14px}
    .cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:640px}
    a.card{
      display:flex;flex-direction:column;align-items:flex-start;text-align:left;
      width:260px;padding:22px;border-radius:16px;text-decoration:none;color:#fff;
      background:#1a1d27;border:1px solid #2a2e3b;transition:border-color .15s,transform .15s;
    }
    a.card:hover{border-color:#5b8cff;transform:translateY(-2px)}
    .card h2{margin:0 0 6px;font-size:17px}
    .card p{margin:0 0 16px;font-size:13px;opacity:.7;line-height:1.5;min-height:36px}
    .card .go{font-size:13px;font-weight:700;color:#7aa1ff}
    .icon{width:40px;height:40px;border-radius:10px;margin-bottom:14px;display:flex;
      align-items:center;justify-content:center;font-size:18px;font-weight:800}
    .icon.nback{background:#7AABDF;color:#1a3a5c}
    .icon.flow{background:#5b8cff;color:#0b0d12}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>siprikorea</h1>
    <p class="sub">Apps &amp; tools</p>
    <div class="cards">
      <a class="card" href="/flow/">
        <div class="icon flow">F</div>
        <h2>Flow</h2>
        <p>Visual, node-based dataflow editor. Build data pipelines without code.</p>
        <span class="go">Learn more →</span>
      </a>
      <a class="card" href="/n-back/">
        <div class="icon nback">N</div>
        <h2>Dual N-Back</h2>
        <p>Brain training game to improve working memory.</p>
        <span class="go">Play →</span>
      </a>
    </div>
  </div>
</body>
</html>
